<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Expense Tracker</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <!-- HEADER -->

    <header>

        <h1>BudgetBuddy-Smart Student Expense Tracker</h1>

        <p>Manage your money easily</p>

    </header>


    <main>


        <!-- SUMMARY -->

        <section class="summary">

            <div class="card">

                <h3>Balance</h3>

                <p id="balance">₹0</p>

            </div>


            <div class="card">

                <h3>Income</h3>

                <p id="income">₹0</p>

            </div>


            <div class="card">

                <h3>Expenses</h3>

                <p id="expenses">₹0</p>

            </div>

        </section>



        <!-- MONTHLY BUDGET -->

<section class="budget-section">

    <h2>Monthly Budget</h2>

    <div class="budget-form">

        <input
            type="number"
            id="budgetInput"
            placeholder="Enter monthly budget"
            min="1"
        >

        <button
            type="button"
            id="setBudgetButton"
        >
            Set Budget
        </button>

    </div>


    <div class="budget-info">

        <p>
            Budget:
            <strong id="budgetAmount">₹0</strong>
        </p>

        <p>
            Spent:
            <strong id="budgetSpent">₹0</strong>
        </p>

        <p>
            Remaining:
            <strong id="budgetRemaining">₹0</strong>
        </p>

    </div>


    <div class="progress-container">

        <div
            id="budgetProgress"
            class="progress-bar"
        ></div>

    </div>


    <p id="budgetMessage"></p>

</section>




        <!-- ADD TRANSACTION -->

        <section class="transaction-form">

            <h2>Add Transaction</h2>

            <form id="expenseForm">


                <label for="type">
                    Type
                </label>

                <select id="type">

                    <option value="expense">
                        Expense
                    </option>

                    <option value="income">
                        Income
                    </option>

                </select>


                <label for="category">
                    Category
                </label>

                <select id="category">

                    <option value="Food">
                        Food
                    </option>

                    <option value="Travel">
                        Travel
                    </option>

                    <option value="Education">
                        Education
                    </option>

                    <option value="Entertainment">
                        Entertainment
                    </option>

                    <option value="Shopping">
                        Shopping
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>


                <label for="description">
                    Description
                </label>

                <input
                    type="text"
                    id="description"
                    placeholder="Example: Lunch"
                    required
                >


                <label for="amount">
                    Amount
                </label>

                <input
                    type="number"
                    id="amount"
                    placeholder="Enter amount"
                    min="1"
                    required
                >


                <label for="date">
                    Date
                </label>

                <input
                    type="date"
                    id="date"
                    required
                >


                <button
                    type="submit"
                    id="submitButton"
                >
                    Add Transaction
                </button>

            </form>

        </section>


        <!-- TRANSACTIONS -->

        <section class="transactions">

            <h2>Recent Transactions</h2>


            <!-- SEARCH AND FILTER -->

            <div class="filters">

                <input
                    type="text"
                    id="search"
                    placeholder="🔍 Search transaction..."
                >


                <select id="filterCategory">

                    <option value="All">
                        All Categories
                    </option>

                    <option value="Food">
                        Food
                    </option>

                    <option value="Travel">
                        Travel
                    </option>

                    <option value="Education">
                        Education
                    </option>

                    <option value="Entertainment">
                        Entertainment
                    </option>

                    <option value="Shopping">
                        Shopping
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <!-- TRANSACTION LIST -->

            <div id="transactionList">

            </div>

        </section>


    </main>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
